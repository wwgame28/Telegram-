name: Apply Some Time Later display font

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Some Time Later display font'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply display font
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('styles.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* ORLICA DISPLAY FONT V7 */'
          if marker in text:
              text = text.split(marker)[0].rstrip() + '\n'

          block = r'''
/* ORLICA DISPLAY FONT V7 */
@font-face{
  font-family:'Some Time Later ORLICA';
  src:url('https://raw.githubusercontent.com/ctrlcctrlv/some-time-later/master/Some%20Time%20Later.woff2') format('woff2');
  font-style:normal;
  font-weight:400;
  font-display:swap;
}
:root{--display-font:'Some Time Later ORLICA','Arial Black',Impact,sans-serif}
.hero-title,
.section-intro h2,
.about-copy h2,
.brief-copy h2,
.slots h2,
.finale h2,
.quote-break p,
.process-card h3,
.logo span{
  font-family:var(--display-font);
  font-weight:400;
  letter-spacing:.005em;
}
.hero-title{line-height:.76;letter-spacing:-.012em}
.section-intro h2,.about-copy h2,.brief-copy h2,.slots h2,.finale h2{line-height:.9;letter-spacing:0}
.quote-break p{line-height:1.02;letter-spacing:0}
.process-card h3{line-height:1.02;letter-spacing:.01em}
.logo span{letter-spacing:.015em;font-size:25px}
.outline,.outline-dark{-webkit-text-stroke-width:1.4px}
@media(max-width:860px){
  .hero-title{font-size:clamp(62px,19vw,112px);line-height:.8}
  .section-intro h2,.about-copy h2,.brief-copy h2{font-size:clamp(46px,13vw,70px);line-height:.94}
  .slots h2,.finale h2{font-size:clamp(46px,12.8vw,68px);line-height:.94}
  .quote-break p{font-size:clamp(31px,8.6vw,45px);line-height:1.05}
  .process-card h3{font-size:clamp(29px,8vw,40px)}
  .logo span{font-size:23px}
}
@media(max-width:430px){
  .hero-title{font-size:clamp(58px,18.2vw,84px)}
  .section-intro h2,.about-copy h2,.brief-copy h2{font-size:clamp(42px,12.2vw,61px)}
}
'''
          css.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          html = Path('index.html')
          h = html.read_text(encoding='utf-8')
          h = re.sub(r'styles\.css\?v=\d+', 'styles.css?v=7', h)
          h = re.sub(r'mobile-fix\.css\?v=\d+', 'mobile-fix.css?v=7', h)
          h = re.sub(r'script\.js\?v=\d+', 'script.js?v=7', h)
          if 'script.js?v=' not in h:
              h = h.replace('script.js"', 'script.js?v=7"')
          html.write_text(h, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html
          git commit -m "Apply Some Time Later display font" || exit 0
          git push
