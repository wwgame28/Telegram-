name: Patch ORLICA v9 typography

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build exact Some Time Later SVG headings
        shell: bash
        run: |
          python -m pip install --quiet fonttools brotli
          curl -L --fail 'https://raw.githubusercontent.com/ctrlcctrlv/some-time-later/master/Some%20Time%20Later.woff2' -o /tmp/some-time-later.woff2
          python - <<'PY'
          from pathlib import Path
          from html import escape
          import re
          from fontTools.ttLib import TTFont
          from fontTools.pens.svgPathPen import SVGPathPen

          font = TTFont('/tmp/some-time-later.woff2')
          glyph_set = font.getGlyphSet()
          cmap = font.getBestCmap()
          hmtx = font['hmtx'].metrics
          upem = font['head'].unitsPerEm
          tracking = 18
          margin_x = 60
          baseline0 = 900
          line_step = 1020

          def glyph_data(ch):
              if ch == ' ':
                  return None, int(upem * 0.34)
              name = cmap.get(ord(ch)) or cmap.get(ord('?'))
              if not name:
                  return None, int(upem * 0.5)
              pen = SVGPathPen(glyph_set)
              glyph_set[name].draw(pen)
              adv = hmtx.get(name, (int(upem * 0.55), 0))[0]
              return pen.getCommands(), adv

          def line_width(text):
              w = 0
              for ch in text:
                  _, adv = glyph_data(ch)
                  w += adv + tracking
              return max(0, w - tracking)

          def make_svg(path, lines, hollow_lines=()):
              widths = [line_width(t) for t in lines]
              width = max(widths) + margin_x * 2
              height = baseline0 + (len(lines)-1)*line_step + 330
              groups = []
              label = ' / '.join(lines)
              for i, text in enumerate(lines):
                  x = margin_x
                  baseline = baseline0 + i * line_step
                  is_hollow = i in set(hollow_lines)
                  if is_hollow:
                      style = 'fill="none" stroke="#0A0A0A" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"'
                  else:
                      style = 'fill="#0A0A0A" fill-rule="evenodd"'
                  parts = [f'<g {style}>']
                  for ch in text:
                      d, adv = glyph_data(ch)
                      if d:
                          parts.append(f'<path d="{d}" transform="translate({x:.2f},{baseline:.2f}) scale(1,-1)"/>')
                      x += adv + tracking
                  parts.append('</g>')
                  groups.append(''.join(parts))
              svg = f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width:.2f} {height:.2f}" role="img" aria-label="{escape(label, quote=True)}">' + ''.join(groups) + '</svg>'
              Path(path).write_text(svg, encoding='utf-8')

          Path('assets/type').mkdir(parents=True, exist_ok=True)
          make_svg('assets/type/process-title.svg', ['БЕЗ КВЕСТА', 'НА 48 УРОВНЕЙ.'], hollow_lines={1})
          make_svg('assets/type/brief-title.svg', ['НУ ДАВАЙТЕ', 'УЖЕ ЧТО-НИБУДЬ', 'ПРИДУМАЕМ.'], hollow_lines={1})
          make_svg('assets/type/faq-title.svg', ['ПЕРЕД ТЕМ', 'КАК НАПИСАТЬ.'], hollow_lines={1})
          make_svg('assets/type/final-title.svg', ['ЕСЛИ ИДЕЯ УЖЕ', 'СИДИТ В ГОЛОВЕ —', 'ТАЩИ ЕЁ СЮДА.'])

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<h2>Без квеста<br>на 48 уровней.</h2>',
              '<img class="display-heading" src="assets/type/process-title.svg" alt="Без квеста на 48 уровней.">'
          )
          s = s.replace(
              '<h2>Ну давайте<br>уже что-нибудь<br>придумаем.</h2>',
              '<img class="display-heading" src="assets/type/brief-title.svg" alt="Ну давайте уже что-нибудь придумаем.">'
          )
          s = s.replace(
              '<h2>Перед тем<br>как написать.</h2>',
              '<img class="display-heading" src="assets/type/faq-title.svg" alt="Перед тем как написать.">'
          )
          s = s.replace(
              '<h2>Если идея уже<br>сидит в голове —<br>тащи её сюда.</h2>',
              '<img class="display-heading" src="assets/type/final-title.svg" alt="Если идея уже сидит в голове — тащи её сюда.">'
          )

          s = re.sub(r'styles\.css\?v=\d+', 'styles.css?v=9', s)
          s = re.sub(r'mobile-fix\.css\?v=\d+', 'mobile-fix.css?v=9', s)
          s = re.sub(r'type-v8\.css\?v=\d+', 'type-v8.css?v=9', s)
          s = re.sub(r'script\.js\?v=\d+', 'script.js?v=9', s)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/type/process-title.svg assets/type/brief-title.svg assets/type/faq-title.svg assets/type/final-title.svg
          if ! git diff --cached --quiet; then
            git commit -m "Unify ORLICA display headings with exact SHA vectors"
            git push
          fi
