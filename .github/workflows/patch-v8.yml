name: Patch ORLICA v8

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-v8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Apply exact typography and portrait
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Cache bust all local assets.
          s = re.sub(r'styles\.css\?v=\d+', 'styles.css?v=8', s)
          s = re.sub(r'mobile-fix\.css\?v=\d+', 'mobile-fix.css?v=8', s)
          s = re.sub(r'script\.js\?v=\d+', 'script.js?v=8', s)
          if 'type-v8.css' not in s:
              s = s.replace('</head>', '  <link rel="stylesheet" href="type-v8.css?v=8" />\n</head>')

          # Use the provided portrait in both portrait placements.
          s = s.replace('assets/artist.jpg', 'assets/sveta-red.jpg')

          # Exact Some Time Later SHA letterforms rendered as SVG paths.
          s = s.replace(
              '<h1 class="hero-title reveal"><span>ТАТУ</span><span class="outline">БЕЗ</span><span>СКУКИ</span></h1>',
              '<div class="hero-title-art reveal"><img src="assets/type/hero-title.svg" alt="ТАТУ БЕЗ СКУКИ"></div>'
          )
          s = s.replace(
              '<h2>Ну что за<br><span class="outline-dark">нежнятина.</span></h2>',
              '<img class="display-heading" src="assets/type/works-title.svg" alt="Ну что за нежнятина.">'
          )
          s = s.replace(
              '<h2>Я Света.<br>Можно просто<br><span class="outline-dark">на «ты».</span></h2>',
              '<img class="display-heading" src="assets/type/about-title.svg" alt="Я Света. Можно просто на ты.">'
          )
          s = re.sub(
              r'<h2>Товарищи,<br>места имеют<br>свойство <span class="strike">ждать</span><br>заканчиваться\.</h2>',
              '<img class="display-heading" src="assets/type/slots-title.svg" alt="Товарищи, места имеют свойство заканчиваться.">',
              s
          )

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Use exact SHA vector typography and Svetа portrait"
            git push
          fi
