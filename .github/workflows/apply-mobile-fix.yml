name: Apply ORLICA font update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Apply font and refresh cache
        run: |
          if ! grep -q "ORLICA DISPLAY FONT V7" styles.css; then printf '%s' '' | base64 -d >> styles.css; fi
          python -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'styles\\.css\\?v=\\d+','styles.css?v=7',s); s=re.sub(r'mobile-fix\\.css\\?v=\\d+','mobile-fix.css?v=7',s); s=re.sub(r'script\\.js\\?v=\\d+','script.js?v=7',s); p.write_text(s,encoding='utf-8')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html
          if ! git diff --cached --quiet; then
            git commit -m "Apply Some Time Later display font"
            git push
          fi
